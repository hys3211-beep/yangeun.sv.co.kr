<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>SV Team Workspace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
/* Layout: phone-first app shell on a white page. Sticky brand bar, single column (max 560px), bottom tab bar.
   Single light theme on purpose (팀 요청: 흰 바탕). Admin mode adds a navy band under the brand bar. */
:root{
  color-scheme:light;
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f4f4f6; --line:#e6e6ea;
  --fg:#222226; --muted:#6b6b74;
  --red:#d8141c; --red-soft:#fdecec; --navy:#1f3c8f; --navy-soft:#eaeefa;
  --ok:#1f7a4d; --ok-soft:#e6f4ec; --warn:#a85f00; --warn-soft:#fdf2e1;
  --f-body:"Noto Sans KR","Source Han Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;font-weight:400;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#fff}
b,strong,h1,h2,h3{font-weight:500}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.bar-in{max-width:560px;margin:0 auto;height:58px;display:flex;align-items:center;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand img{display:block;height:24px;width:auto;flex:none}
.brand .ws{font-size:12px;flex:none;color:var(--muted);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:1px solid var(--line);padding-left:10px}
.who{flex:none;display:flex;align-items:center;gap:6px;background:var(--surface-2);border:0;border-radius:999px;padding:4px 11px 4px 4px;font-size:13px}
.who .av{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:11.5px}
.admin-band{background:var(--navy);color:#fff}
.admin-band div{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;padding-block:7px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.admin-band span:first-child{letter-spacing:.4px}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 160px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{margin:0;text-wrap:balance}
.hello{display:flex;flex-direction:column;gap:2px}
.hello small{color:var(--muted);font-size:13px}
.hello h1{font-size:22px;line-height:1.35}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font-size:16.5px}
.sec-h .meta{font-size:12px;color:var(--muted)}
.link{background:none;border:0;padding:0;color:var(--navy);font-size:13px}

.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left}
.tile .k{font-size:12.5px;color:var(--muted)}
.tile .v{font-size:26px;line-height:1.15}
.tile.late{background:var(--red-soft);border-color:transparent} .tile.late .v,.tile.late .k{color:var(--red)}
.tile.doing .v{color:var(--navy)} .tile.done .v{color:var(--ok)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:left}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .t{font-size:15px;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.empty{padding:18px 14px;color:var(--muted);font-size:14px}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;border-radius:6px;padding:2px 7px;white-space:nowrap}
.c-red{background:var(--red-soft);color:var(--red)} .c-warn{background:var(--warn-soft);color:var(--warn)}
.c-navy{background:var(--navy-soft);color:var(--navy)} .c-ok{background:var(--ok-soft);color:var(--ok)} .c-mute{background:var(--surface-2);color:var(--muted)}

.st{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;font-size:12.5px;padding:6px 10px;min-width:64px}
.st.s-todo{color:var(--muted)} .st.s-doing{background:var(--navy-soft);color:var(--navy);border-color:transparent}
.st.s-done{background:var(--ok-soft);color:var(--ok);border-color:transparent} .st.s-late{background:var(--red-soft);color:var(--red);border-color:transparent}
.row.is-done .t{text-decoration:line-through;color:var(--muted)}

.idx{flex:none;min-width:20px;text-align:right;font-size:13px;color:var(--muted)}
.sev{flex:none;width:5px;align-self:stretch;border-radius:3px;background:var(--line)}
.sev.hi{background:var(--red)} .sev.md{background:var(--warn)}
.delta.down{color:var(--red)} .delta.up{color:var(--ok)}
.right{flex:none;text-align:right;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.right .big{font-size:14px}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--fg);color:#fff;border-color:var(--fg)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}
input,textarea,select{font:inherit;color:var(--fg);background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
textarea{min-height:100px;resize:vertical}
.btn{border:0;border-radius:12px;padding:13px 16px;background:var(--red);color:#fff;width:100%;font-size:15px}
.btn.navy{background:var(--navy)} .btn.ghost{background:var(--surface-2);color:var(--fg)} .btn.sm{width:auto;padding:9px 14px;font-size:13.5px}
.inline{display:flex;gap:8px} .inline>*{min-width:0}
.note{font-size:12.5px;color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}

.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h strong{font-size:16px}
.cal-h button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;width:34px;height:34px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dow{font-size:11.5px;color:var(--muted);padding:4px 0}
.day{border:0;background:none;border-radius:10px;padding:6px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:14px;min-width:0}
.day.out{opacity:.35}
.day.today span:first-child{background:var(--fg);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.day[aria-pressed="true"]{background:var(--surface-2)}
.dots{display:flex;gap:2px;height:6px;flex-wrap:wrap;justify-content:center;max-width:36px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--navy)}
.dots i.team{background:var(--red)}
.sun{color:var(--red)}
.ev-time{flex:none;width:48px;font-size:13px;color:var(--muted)}
.ev-edit{flex:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:12.5px;color:var(--muted)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-in{max-width:560px;margin:0 auto;display:flex}
.nav button{flex:1;border:0;background:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);position:relative}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--red)}
.nav.admin button[aria-current="page"]{color:var(--navy)}
.nav .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;border-radius:999px;padding:0 5px;line-height:15px}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:18px 18px 0 0;max-height:88%;overflow:auto;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--surface-2);border-radius:10px;padding:10px}
.kv .k{font-size:12px;color:var(--muted)} .kv .v{font-size:16px}

.login{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:8px}
.login h1{font-size:26px;letter-spacing:.2px}
.people{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.person{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column}
.person span{font-size:12px;color:var(--muted)}
.person[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.person.adm{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
.pin{letter-spacing:10px;text-align:center;font-size:22px}
.banner{background:var(--navy-soft);color:var(--navy);border-radius:12px;padding:10px 12px;font-size:12.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:#fff;padding:9px 14px;border-radius:999px;font-size:13px;z-index:50}
.bars{display:flex;align-items:flex-end;gap:6px;height:64px}
.bars div{flex:1;background:var(--surface-2);border-radius:4px 4px 0 0}
.bars div.cur{background:var(--red)}
.bars-l{display:flex;gap:6px;font-size:11.5px;color:var(--muted)} .bars-l span{flex:1;text-align:center}
.meter{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .k{font-size:12.5px;color:var(--muted)} .kpi .v{font-size:24px;line-height:1.2} .kpi .sub{font-size:12px;color:var(--muted)}
.feed-d{font-size:12.5px;color:var(--muted);padding:10px 14px 4px;background:var(--surface-2)}
.code{font-size:18px;letter-spacing:4px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:21;width:56px;height:56px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(216,20,28,.35)}
.fab svg{width:26px;height:26px}
.mic{width:72px;height:72px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;margin:0 auto}
.mic svg{width:32px;height:32px}
.mic.on{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(216,20,28,.45)}100%{box-shadow:0 0 0 18px rgba(216,20,28,0)}}
.back{border:0;background:none;padding:0;color:var(--muted);font-size:14px;display:inline-flex;align-items:center;gap:4px;align-self:flex-start}
.parsed{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:13.5px;align-items:center}
.parsed span:nth-child(odd){color:var(--muted)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:12px;color:var(--muted)} .stat .v{font-size:16px} .stat .sub{font-size:11.5px;color:var(--muted)}
.wk{display:flex;align-items:center;justify-content:space-between}
.wk button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
.chk{flex:none;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;color:transparent}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head><body>

let SHOPS=[], DB={tasks:[],events:[],records:[],acts:[],notice:""}, PERIOD={cur:"",synced:""};
function flagShop(s){
  s.d = s.p>0 ? (s.w-s.p)/s.p*100 : null;
  const f=[]; let score=0;
  if(s.p>0 && s.w===0){f.push(["매출 없음","c-red"]);score+=5;}
  else if(s.d!==null && s.d<=-15){f.push([`매출 ${s.d.toFixed(0)}%`,"c-red"]);score+=4;}
  else if(s.d!==null && s.d<=-10){f.push([`매출 ${s.d.toFixed(0)}%`,"c-warn"]);score+=2;}
  if(s.r && s.r.neg>=2){f.push([`부정 리뷰 ${s.r.neg}건`,"c-red"]);score+=3;}
  else if(s.r && s.r.neg===1){f.push(["부정 리뷰 1건","c-warn"]);score+=1;}
  if(s.q && (s.q.grade==="C"||s.q.grade==="D")){f.push([`QSC ${s.q.grade} ${s.q.score}점`,"c-red"]);score+=3;}
  if(s.q && s.q.grade==="작성중"){f.push(["QSC 작성중","c-warn"]);score+=1;}
  if(s.r && s.r.n>=20 && s.r.reply<30){f.push([`답글 ${Math.round(s.r.reply)}%`,"c-mute"]);score+=0.5;}
  s.flags=f; s.score=score; return s;
}
const hm=iso=>{const d=new Date(iso);return pad(d.getHours())+":"+pad(d.getMinutes());};
const dOf=iso=>ymd(new Date(iso));
async function rpc(fn,args){
  const {data,error}=await sb.rpc(fn,args);
  if(error){ if(/SESSION_EXPIRED/.test(error.message)){logout();throw new Error("다시 로그인해 주세요");} throw new Error(error.message); }
  return data;
}
async function load(){
  const b=await rpc("sv_bootstrap",{p_token:TOKEN});
  me=byId(b.me.id)||b.me;
  SHOPS=b.shops.map(s=>flagShop({n:s.name,sv:s.sv,w:+s.w,p:+s.p,r:s.rev,q:s.qsc}));
  const up=b.shops.reduce((a,s)=>s.updated_at>a?s.updated_at:a,"");
  PERIOD={cur:(b.shops[0]&&b.shops[0].period)||"",synced:up?`${new Date(up).getMonth()+1}월 ${new Date(up).getDate()}일 ${hm(up)}`:""};
  DB.tasks=b.tasks.map(t=>({id:t.id,who:t.member_id,title:t.title,due:t.due,status:t.status,shop:t.shop||"",src:t.src||""}));
  DB.events=b.events.map(e=>({id:e.id,who:e.member_id,date:e.date,time:e.time||"",type:e.type,shop:e.shop||"",title:e.title||"",memo:e.memo||"",done:e.done}));
  DB.records=b.records.map(r=>({id:r.id,who:r.member_id,date:dOf(r.at),time:hm(r.at),kind:r.kind,shop:r.shop||"",text:r.text,amount:r.amount?+r.amount:null,due:r.due||"",paid:r.paid,needsReview:r.needs_review}));
  DB.acts=b.acts.map(a=>({who:a.member_id,date:dOf(a.at),time:hm(a.at),to:a.kind,title:a.title||""}));
  DB.notice=b.notice||"";
}

/* 저장 후 다시 불러와서 그리기 */
async function save(fn,args,msg){

/* simple auto-organize of spoken text */
function organize(text, shops){
  const t=text.replace(/\s+/g," ").trim();
  const o={kind:"기타",shop:"",amount:null,due:"",ok:false};
  if(/미수|입금|외상|잔금|미납|물대/.test(t)) o.kind="미수금";
  else if(/리뷰|별점|댓글/.test(t)) o.kind="리뷰 조치";
  else if(/전화|통화|연락/.test(t)) o.kind="전화소통";
  else if(/방문|다녀|점검/.test(t)) o.kind="방문 메모";
  const names=shops.map(s=>s.n).sort((a,b)=>b.length-a.length);
  for(const n of names){const core=n.replace(/점$/,"");if(t.includes(n)||t.includes(core)){o.shop=n;break;}}
  let m=t.match(/(\d[\d,]*)\s*만\s*(\d[\d,]*)?\s*천?\s*원?/);
  if(m){o.amount=Number(m[1].replace(/,/g,""))*10000+(m[2]?Number(m[2].replace(/,/g,""))*1000:0);}
  else if((m=t.match(/(\d[\d,]{3,})\s*원/))) o.amount=Number(m[1].replace(/,/g,""));
  else if((m=t.match(/(백|이백|삼백|오십|십)\s*만/))){o.amount={"십":10,"오십":50,"백":100,"이백":200,"삼백":300}[m[1]]*10000;}
  if((m=t.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/))) o.due=`${TODAY.getFullYear()}-${pad(+m[1])}-${pad(+m[2])}`;
  else if((m=t.match(/(\d{1,2})\s*일\s*까지/))) o.due=`${TODAY.getFullYear()}-${pad(TODAY.getMonth()+1)}-${pad(+m[1])}`;
  else if(/모레/.test(t)) o.due=ymd(addDays(TODAY,2));
  else if(/내일/.test(t)) o.due=ymd(addDays(TODAY,1));
  else if((m=t.match(/다음\s*주\s*([월화수목금토일])요일/))){const target=WD.indexOf(m[1]);o.due=ymd(addDays(TODAY,7-TODAY.getDay()+target));}
  o.ok = !!o.shop && o.kind!=="기타" && (o.kind!=="미수금" || (o.amount && o.due));
  return o;
}

let rec=null;
function openRecorder(shop){
  const shops=shopsOf(me.name);
  $("#layer").innerHTML=`<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-label="말로 기록하기"><div class="sheet-in"><div class="grab"></div>

    <button class="mic" id="micBtn" aria-label="녹음 시작">${ICON.mic}</button>
    <p class="note" id="micMsg" style="text-align:center">눌러서 말하기</p>
    <div class="field"><label for="rtx">받아 적은 내용 (고쳐도 돼요)</label><textarea id="rtx" placeholder="여기에 말한 내용이 적혀요. 폰 키보드의 마이크로 말해도 돼요."></textarea></div>
    <button class="btn ghost" id="orgBtn">자동 정리하기</button>
    <div id="orgOut"></div></div></div>`;
  const mic=$("#micBtn"),msg=$("#micMsg"),tx=$("#rtx");
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  mic.onclick=()=>{
    if(rec){rec.stop();return;}
    if(!SR){msg.textContent="이 화면에서는 마이크를 바로 쓸 수 없어요. 아래 칸을 누르고 폰 키보드의 마이크로 말해 주세요.";tx.focus();return;}
    try{
      rec=new SR();rec.lang="ko-KR";rec.interimResults=true;rec.continuous=true;const base=tx.value?tx.value+" ":"";
      rec.onresult=e=>{let s="";for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;tx.value=base+s;};
      rec.onerror=e=>{msg.textContent=e.error==="not-allowed"?"마이크 권한이 막혀 있어요. 폰 키보드의 마이크로 말해 주세요.":"인식이 끊겼어요. 다시 눌러 주세요.";};
      rec.onend=()=>{rec=null;mic.classList.remove("on");if(msg.textContent==="듣고 있어요. 다 말하면 다시 누르세요.")msg.textContent="눌러서 이어 말하기";if(tx.value.trim())showOrg(shop);};
      rec.start();mic.classList.add("on");msg.textContent="듣고 있어요. 다 말하면 다시 누르세요.";
    }catch(err){rec=null;msg.textContent="이 화면에서는 마이크를 바로 쓸 수 없어요. 아래 칸을 누르고 폰 키보드의 마이크로 말해 주세요.";tx.focus();}
  };
  $("#orgBtn").onclick=()=>showOrg(shop);
}

  const from=ymd(addDays(TODAY,-7));const all=[];
  MEMBERS.forEach(p=>eventsOf(p).forEach(e=>{if(e.done&&e.date>=from&&e.date<=ymd(TODAY))all.push({date:e.date,time:e.time,who:p,type:"방문 완료",title:evTitle(e),memo:e.memo,c:"c-ok"});}));
  actsAll().forEach(x=>{const p=byId(x.who);if(p&&x.date>=from&&x.to!=="visit")all.push({date:x.date,time:x.time,who:p,type:ACT_LABEL[x.to],title:x.title,memo:"",c:x.to==="done"?"c-ok":x.to==="doing"?"c-navy":"c-mute"});});
  allRecords().forEach(r=>{if(r.date>=from)all.push({date:r.date,time:r.time,who:byId(r.who),type:r.kind,title:(r.shop?r.shop+" · ":"")+r.text,memo:"",c:KIND_CHIP[r.kind]});});
  all.sort((a,b)=>(b.date+(b.time||"")).localeCompare(a.date+(a.time||"")));
  const g=[];let cur=null;all.forEach(e=>{if(e.date!==cur){cur=e.date;g.push(`<div class="feed-d">${md(e.date)} ${WD[parse(e.date).getDay()]}요일</div>`);}
    g.push(`<div class="row"><span class="dot" style="background:${e.who.color};width:10px;height:10px"></span><div class="main"><span class="t">${e.who.name} · ${esc(e.title)}</span>
      <span class="s"><span class="chip ${e.c}">${esc(e.type)}</span>${e.memo?`<span>${esc(e.memo)}</span>`:""}</span></div><span class="ev-time num" style="text-align:right">${esc(e.time||"")}</span></div>`);});
  $("#view").innerHTML=`<div class="hello"><small>최근 7일 업무·방문·소통 기록, 시간순</small><h1>팀원 활동</h1></div>
  <div class="list">${g.join("")||'<div class="empty">최근 활동이 없어요.</div>'}</div>`;
}
function adminManage(){
  $("#view").innerHTML=`
  <button class="back" data-tab="home">${ICON.back.replace('<svg','<svg width="18" height="18"')} 종합</button>
  <div class="hello"><small>팀원 입장코드와 공지를 관리해요</small><h1>관리</h1></div>
  <section class="sec"><div class="sec-h"><h2>입장코드</h2><span class="meta">새로 발급하면 이 화면에 한 번만 보여요</span></div>
    <div class="list">${TEAM.map(p=>`<div class="row"><span class="dot" style="background:${p.color};width:10px;height:10px"></span><div class="main"><span class="t">${p.name} ${p.role}</span><span class="s">${p.leader?"관리자":"담당 "+shopsOf(p.name).length+"곳"}</span></div>
      <span class="code num" id="code-${p.id}">····</span><button class="ev-edit" data-newcode="${p.id}">새로 발급</button></div>`).join("")}</div></section>
  <section class="card"><h3 style="font-size:15px">팀 공지</h3>
    <textarea id="ntc" placeholder="팀원 홈 화면 위에 보일 공지를 적어주세요.">${esc(DB.notice)}</textarea>
    <button class="btn navy" id="ntcs">공지 저장</button></section>`;
  $("#ntcs").onclick=()=>{const v=$("#ntc").value;document.activeElement.blur();save("sv_set_notice",{p_text:v},"공지를 저장했어요");};
}
function openOrganize(who,id){
  const u=byId(who);const r=recordsOf(u).find(x=>x.id===id);if(!r)return;
  $("#layer").innerHTML=`<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-label="기록 정리"><div class="sheet-in"><div class="grab"></div>
    <div class="sec-h"><h2 style="font-size:18px">${u.name} 원문 정리</h2><span class="meta">${md(r.date)} ${esc(r.time)}</span></div>
    <div class="card" style="background:var(--surface-2);border:0">${esc(r.text)}</div>
    <form class="field" id="ogf" style="gap:10px">
      <div class="inline"><div class="field" style="flex:1"><label for="gk">종류</label><select id="gk">${KINDS.map(k=>`<option ${r.kind===k?"selected":""}>${k}</option>`).join("")}</select></div>
        <div class="field" style="flex:1.3"><label for="gs">매장</label><select id="gs"><option value="">매장 없음</option>${shopsOf(u.name).map(s=>`<option ${r.shop===s.n?"selected":""}>${esc(s.n)}</option>`).join("")}</select></div></div>
      <div class="field"><label for="gt">정리한 내용</label><textarea id="gt">${esc(r.text)}</textarea></div>
      <button class="btn navy" type="submit">정리 완료</button></form></div></div>`;
  $("#ogf").onsubmit=e=>{e.preventDefault();const p={id,kind:$("#gk").value,shop:$("#gs").value,text:$("#gt").value.trim(),needs_review:false};$("#layer").innerHTML="";save("sv_save_record",{p},"정리했어요");};
}

function render(){
  $("#layer").innerHTML="";
  if(!me) return viewLogin();
  header();
  if(state.shop) return viewShop();
  const V=me.leader?{home:adminHome,teamcal:adminTeamCal,feed:adminFeed,stores:viewStores,recs:viewRecs,admin:adminManage}:{home:viewHome,visit:viewVisit,stores:viewStores,recs:viewRecs,cal:viewMyCal};
  (V[state.tab]||V.home)();
  const n=DB.notice;if(n&&!me.leader&&state.tab==="home"){const d=document.createElement("div");d.className="banner";d.textContent="팀 공지 · "+n;$("#view").prepend(d);}
}
const keep=fn=>{const y=window.scrollY;fn();window.scrollTo(0,y);};

document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-close]");if(!b)return;const d=b.dataset;
  if(d.tab){state.tab=d.tab;state.shop=null;state.editEv=null;if(d.rk)state.recKind=d.rk;else if(d.tab==="recs")state.recKind="전체";if(d.tab!=="stores")state.svFilter=null;render();window.scrollTo(0,0);}
  else if("admin" in d){state.tab="admin";render();window.scrollTo(0,0);}
  else if(d.cycle){const x=tasksOf(me).find(y=>y.id===d.cycle);if(!x)return;const ns={todo:"doing",doing:"done",done:"todo"}[x.status];save("sv_save_task",{p:{id:x.id,status:ns}},`'${x.title}' ${ST_LABEL[ns]} · 팀장님께 공유됐어요`);}
  else if(d.visit){const x=eventsOf(me).find(y=>y.id===d.visit);if(!x)return;save("sv_save_event",{p:{id:x.id,done:!x.done}},!x.done?`${x.shop} 방문 완료 · 팀장님께 공유됐어요`:"방문 완료를 취소했어요");}
  else if(d.wk){state.wk+=Number(d.wk);keep(render);}
  else if(d.sf){state.storeFilter=d.sf;keep(render);}
  else if(d.sv){state.svFilter=d.sv==="전체"?null:d.sv;keep(render);}
  else if(d.svgo){state.tab="stores";state.shop=null;state.svFilter=d.svgo;state.storeFilter="flag";render();window.scrollTo(0,0);}
  else if("tcw" in d){state.teamCalWho=d.tcw||null;keep(render);}
  else if(d.rk){state.recKind=d.rk;keep(render);}
  else if("rw" in d){state.recWho=d.rw||null;keep(render);}
  else if(d.shop){state.shop=d.shop;render();window.scrollTo(0,0);}
  else if("backshop" in d){state.shop=null;render();}
  else if("recshop" in d){openRecorder(d.recshop);}
  else if(b.id==="fab"){openRecorder(state.shop||"");}
  else if(d.paid){save("sv_save_record",{p:{id:d.paid,paid:true}},"입금 완료로 바꿨어요");}
  else if(d.organize){const [w,id]=d.organize.split("|");openOrganize(w,id);}
  else if(d.addvisit){save("sv_save_event",{p:{date:ymd(addDays(TODAY,1)),time:"11:00",type:"매장 방문",shop:d.addvisit}},"내일 11시 방문 일정을 넣었어요");}
  else if(d.edit){state.editEv=d.edit;render();document.getElementById("evf").scrollIntoView({behavior:"smooth"});}
  else if("cancel" in d){state.editEv=null;keep(render);}
  else if(d.del){state.editEv=null;save("sv_delete_event",{p_id:d.del},"일정을 삭제했어요");}
  else if(d.newcode){const id=d.newcode;const code=String(1000+(crypto.getRandomValues(new Uint32Array(1))[0]%9000));rpc("sv_set_code",{p_token:TOKEN,p_member:id,p_code:code}).then(()=>{const el=document.getElementById("code-"+id);if(el)el.textContent=code;toast(`${byId(id).name} 새 코드 ${code} · 기존 로그인은 풀려요`);}).catch(e=>toast(e.message));}
  else if(d.mv){state.calMonth=new Date(state.calMonth.getFullYear(),state.calMonth.getMonth()+Number(d.mv),1);keep(render);}
  else if(d.day){state.calDay=d.day;state.editEv=null;keep(render);}
  else if("close" in d){if(rec)try{rec.stop();}catch(_){}$("#layer").innerHTML="";}
  else if(b.id==="whoBtn"){logout();}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#layer").innerHTML="";});
(async function(){ if(TOKEN){ $("#view").innerHTML='<p class="note">불러오는 중…</p>'; try{ await load(); }catch(e){ TOKEN=null; store.set("token",null); me=null; } } render(); })();
</script>

</body></html>
